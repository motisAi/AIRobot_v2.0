<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stella</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;cursor:none;background:#0e1622;}
  #face{display:block;width:100vw;height:100vh;}
  #tag{position:fixed;left:8px;bottom:6px;font:11px monospace;color:#243040;}
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="tag"></div>
<script>
"use strict";
const cv=document.getElementById('face'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,R=200,CX=0,CY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  R=Math.min(W,H)*0.33; CX=W/2; CY=H*0.52;
}
addEventListener('resize',resize); resize();

// ---- palette ----
const SKIN='#f2c9a5', SKIN_SH='#d9a984', HAIR='#3b2a24', HAIR_HI='#4d382e',
      IRIS='#7d5a86', LIP='#c9727a', WHITE='#fbf7f4';

// ---- expression presets ----  eyeOpen, brow(y off), browTilt, mouthCurve, blush, bg
const P={
 neutral:  {eye:1.0, brow:0.0, tilt:0.0, mouth:0.18, blush:0.25, bg:'#12203a'},
 happy:    {eye:0.85,brow:-0.10,tilt:0.10, mouth:0.75, blush:0.55, bg:'#153a33'},
 curious:  {eye:1.12,brow:-0.22,tilt:0.18, mouth:0.30, blush:0.35, bg:'#123a4a'},
 thinking: {eye:0.8, brow:-0.12,tilt:-0.20,mouth:0.05, blush:0.20, bg:'#2a2340'},
 listening:{eye:1.08,brow:-0.14,tilt:0.05, mouth:0.22, blush:0.30, bg:'#123048'},
 sad:      {eye:0.72,brow:0.10, tilt:-0.45,mouth:-0.55,blush:0.15, bg:'#16233f'},
 alert:    {eye:1.3, brow:-0.25,tilt:0.0,  mouth:-0.15,blush:0.20, bg:'#3a1418'},
 sleep:    {eye:0.06,brow:0.05, tilt:0.0,  mouth:0.10, blush:0.20, bg:'#0c1526'},
 offline:  {eye:0.10,brow:0.0,  tilt:0.0,  mouth:0.0,  blush:0.10, bg:'#10151d'},
};
let cur=Object.assign({},P.neutral), tgt=Object.assign({},P.neutral);
function setEmotion(n,inten){ const p=P[n]||P.neutral; const k=(inten==null?1:Math.max(0,Math.min(1,inten)));
  const b=P.neutral; tgt={eye:b.eye+(p.eye-b.eye)*k, brow:p.brow*k, tilt:p.tilt*k, mouth:b.mouth+(p.mouth-b.mouth)*k, blush:p.blush, bg:p.bg}; }

// ---- animation state ----
let blink=0,blinking=false,bT=0,nextBlink=1600;
let gx=0,gy=0,tgX=0,tgY=0,gazeMode='idle';
let speaking=false,talk=0,talkT=0,talkPhase=0,lastVis=0;
let bg=P.neutral.bg;
function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){ // hex mix
  const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  const r=Math.round((a>>16)+(((b>>16)-(a>>16))*t)), g=Math.round(((a>>8)&255)+((((b>>8)&255)-((a>>8)&255))*t)), bl=Math.round((a&255)+(((b&255)-(a&255))*t));
  return `rgb(${r},${g},${bl})`;
}

function step(dt,now){
  for(const k of ['eye','brow','tilt','mouth','blush']) cur[k]=lerp(cur[k],tgt[k],1-Math.pow(0.0008,dt));
  // blink
  if(tgt===P.sleep||curIs('sleep')||curIs('offline')){}
  if(!blinking && now>nextBlink){ blinking=true; bT=0; }
  if(blinking){ bT+=dt*8.5; blink=Math.max(0,Math.sin(bT)); if(bT>=Math.PI){ blinking=false; blink=0; nextBlink=now+(2400+Math.random()*(gazeMode==='track'?2000:4200)); } }
  // gaze
  if(gazeMode==='idle'){ if(Math.random()<0.005){ tgX=(Math.random()*2-1)*0.6; tgY=(Math.random()*2-1)*0.4; } }
  else if(gazeMode==='center'){ tgX=0; tgY=0; }
  gx=lerp(gx,tgX,1-Math.pow(0.003,dt)); gy=lerp(gy,tgY,1-Math.pow(0.003,dt));
  // talk
  if(speaking && (now-lastVis)>200){ talkPhase+=dt*10; talkT=0.3+0.55*Math.abs(Math.sin(talkPhase)); }
  talk=lerp(talk,talkT,1-Math.pow(0.0006,dt));
}
function curIs(){return false;}

function bgFill(){ bg=bg; const g=ctx.createRadialGradient(CX,CY,R*0.2,CX,CY,Math.max(W,H)*0.75);
  g.addColorStop(0, mixBG(0.0)); g.addColorStop(1, '#0a0f18'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
let bgCur=P.neutral.bg;
function mixBG(){ bgCur=blend(bgCur,tgt.bg,0.05); return bgCur; }
function blend(c1,c2,t){ if(c1[0]!=='#') c1='#12203a'; if(c2[0]!=='#') c2='#12203a';
  const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  const r=Math.round((a>>16)+(((b>>16)-(a>>16))*t)),g=Math.round(((a>>8)&255)+((((b>>8)&255)-((a>>8)&255))*t)),bl=Math.round((a&255)+(((b&255)-(a&255))*t));
  const h=(r<<16|g<<8|bl).toString(16).padStart(6,'0'); return '#'+h; }

function drawHair(){
  ctx.save(); ctx.translate(CX,CY);
  ctx.fillStyle=HAIR;
  ctx.beginPath(); ctx.ellipse(0,-R*0.12,R*0.98,R*1.12,0,0,Math.PI*2); ctx.fill();
  // hair highlight
  ctx.fillStyle=HAIR_HI; ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.ellipse(-R*0.35,-R*0.5,R*0.4,R*0.55,-0.4,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
}
function drawFace(){
  ctx.save(); ctx.translate(CX,CY);
  const g=ctx.createRadialGradient(0,-R*0.1,R*0.2,0,0,R*1.1);
  g.addColorStop(0,SKIN); g.addColorStop(1,SKIN_SH);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(0,0,R*0.76,R*0.98,0,0,Math.PI*2); ctx.fill();
  // neck
  ctx.fillStyle=SKIN_SH; ctx.fillRect(-R*0.28,R*0.75,R*0.56,R*0.5);
  // cheeks blush
  ctx.globalAlpha=cur.blush*0.6; ctx.fillStyle='#e98a8a';
  for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*R*0.4,R*0.28,R*0.18,R*0.12,0,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1; ctx.restore();
}
function drawBrow(sx){
  ctx.save(); ctx.translate(CX+sx*R*0.38, CY-R*0.34+cur.brow*R);
  ctx.rotate(sx*cur.tilt); ctx.strokeStyle=HAIR; ctx.lineWidth=R*0.055; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-R*0.2,0); ctx.quadraticCurveTo(0,-R*0.09,R*0.2,-R*0.01); ctx.stroke(); ctx.restore();
}
function drawEye(sx){
  const ex=CX+sx*R*0.38, ey=CY-R*0.12, ew=R*0.30, eh=R*0.19*cur.eye;
  const open=Math.max(0.04,(1-blink));
  ctx.save(); ctx.translate(ex,ey);
  // white
  ctx.fillStyle=WHITE; ctx.beginPath(); ctx.ellipse(0,0,ew/2,eh/2*open,0,0,Math.PI*2); ctx.fill();
  // clip to white for iris
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,ew/2,eh/2*open,0,0,Math.PI*2); ctx.clip();
  const px=gx*ew*0.22, py=gy*eh*0.28;
  // iris
  const ig=ctx.createRadialGradient(px,py,R*0.02,px,py,R*0.11);
  ig.addColorStop(0,'#b79ac0'); ig.addColorStop(0.5,IRIS); ig.addColorStop(1,'#3a2a44');
  ctx.fillStyle=ig; ctx.beginPath(); ctx.arc(px,py,R*0.105,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#160f1c'; ctx.beginPath(); ctx.arc(px,py,R*0.05,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(px-R*0.035,py-R*0.035,R*0.022,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // upper lid shadow + lash line
  ctx.strokeStyle='rgba(80,55,45,.55)'; ctx.lineWidth=R*0.02;
  ctx.beginPath(); ctx.ellipse(0,0,ew/2,eh/2*open,0,Math.PI*1.02,Math.PI*1.98); ctx.stroke();
  ctx.strokeStyle=HAIR; ctx.lineWidth=R*0.03; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-ew/2,-eh*0.05*open); ctx.quadraticCurveTo(0,-eh*0.6*open,ew/2,-eh*0.05*open); ctx.stroke();
  ctx.restore();
}
function drawNose(){
  ctx.save(); ctx.translate(CX,CY); ctx.strokeStyle='rgba(180,130,100,.55)'; ctx.lineWidth=R*0.02; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-R*0.03,-R*0.02); ctx.lineTo(-R*0.06,R*0.18); ctx.quadraticCurveTo(0,R*0.24,R*0.06,R*0.18); ctx.stroke(); ctx.restore();
}
function drawMouth(){
  ctx.save(); ctx.translate(CX,CY+R*0.46);
  const w=R*0.42, curve=cur.mouth*R*0.22, open=talk*R*0.34;
  if(open>2){
    ctx.fillStyle='#5a2530';
    ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.quadraticCurveTo(0,curve*0.4,w/2,0);
    ctx.quadraticCurveTo(0,curve*0.4+open,-w/2,0); ctx.fill();
    ctx.fillStyle='#fff'; ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.moveTo(-w*0.36,-1); ctx.quadraticCurveTo(0,curve*0.3-2,w*0.36,-1);
    ctx.quadraticCurveTo(0,curve*0.3+2,-w*0.36,-1); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.strokeStyle=LIP; ctx.lineWidth=R*0.055; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.quadraticCurveTo(0,curve+open,w/2,0); ctx.stroke();
  // upper lip
  ctx.lineWidth=R*0.04;
  ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.quadraticCurveTo(0,-Math.abs(curve)*0.4-open*0.3,w/2,0); ctx.stroke();
  ctx.restore();
}

function draw(){
  bgFill();
  const tilt=gx*0.03;                       // gentle head tilt with gaze
  ctx.save(); ctx.translate(CX,CY); ctx.rotate(tilt); ctx.translate(-CX,-CY);
  drawHair(); drawFace(); drawBrow(-1); drawBrow(1); drawEye(-1); drawEye(1); drawNose(); drawMouth();
  ctx.restore();
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; step(dt,now); draw(); requestAnimationFrame(loop); }
setEmotion('offline',1); requestAnimationFrame(loop);

// ---- WebSocket (same-origin, motiAi.local works automatically) ----
let ws=null,backoff=500;
function connect(){ const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  try{ws=new WebSocket(url);}catch(e){retry();return;}
  ws.onopen=()=>{backoff=500;tag('online');setEmotion('neutral',1);ws.send(JSON.stringify({type:'hello',device:'browser',screen:[W,H]}));};
  ws.onclose=()=>{tag('offline');setEmotion('offline',1);retry();};
  ws.onerror=()=>{try{ws.close();}catch(e){}};
  ws.onmessage=(ev)=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}handle(m);};
}
function retry(){setTimeout(connect,backoff);backoff=Math.min(5000,backoff*1.7);}
function handle(m){switch(m.type){
  case 'emotion': setEmotion(m.value,m.intensity); break;
  case 'look_at': tgX=Math.max(-1,Math.min(1,m.x||0)); tgY=Math.max(-1,Math.min(1,m.y||0)); gazeMode='track'; break;
  case 'gaze_mode': gazeMode=m.value||'idle'; break;
  case 'speak_start': speaking=true; talkPhase=0; break;
  case 'viseme': talkT=Math.max(0,Math.min(1,m.level||0)); lastVis=performance.now(); break;
  case 'speak_end': speaking=false; talkT=0; break;
  case 'blink': nextBlink=performance.now(); break;
  case 'state': if(m.listening) setEmotion('listening',1); break;
}}
function tag(s){document.getElementById('tag').textContent='stella · '+s;}
tag('connecting'); connect();
</script>
</body>
</html>
