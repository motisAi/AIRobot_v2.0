; Stella's ESP32-S3 firmware (eyes + arm + hand) - build + flash from the LAPTOP:
;   cd firmware
;   pio run -t upload --upload-port COM7      (COMx = the board's CH343 UART port)
; Stop anything holding the port first (the Pi service, a serial monitor).
[platformio]
src_dir = stella_s3
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@6.5.0        ; arduino-esp32 2.0.x - the version the eyes were proven on
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

; classic ESP32 (ESP32-D0WD, CH340 USB): same code, its own pins (see eyes.cpp / servos.cpp)
;   pio run -e esp32 -t upload --upload-port COM3
[env:esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
